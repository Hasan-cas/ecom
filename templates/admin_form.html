<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markazus Sunnah | Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Extracting brand variables from index.html */
        :root { --sage: #F4E1C4; --dark-forest: #C8A86A ; }
        body { font-family: 'Inter', sans-serif; }
        .serif { font-family: 'Playfair Display', serif; }
        .bg-sage { background-color: var(--sage); }
        .text-forest { color: var(--dark-forest); }
        .bg-forest { background-color: var(--dark-forest); }
        .border-forest { border-color: var(--dark-forest); }

        /* Smooth fade in for errors */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-sage min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-[40px] shadow-2xl overflow-hidden p-8 md:p-12">

        <div class="text-center mb-10">
            <a href="/" class="inline-block text-3xl font-bold tracking-tighter serif text-forest mb-2 hover:opacity-70 transition">Markazus Sunnah.</a>
            <h1 class="text-xs uppercase tracking-[0.3em] text-gray-500 font-bold">Secure Admin Portal</h1>
        </div>

        <div id="message-container" class="hidden mb-6 p-4 rounded-xl text-sm text-center" role="alert" aria-live="polite"></div>

        <form id="login-form" class="space-y-6">

            <div class="space-y-2">
                <label for="username" class="block text-xs uppercase tracking-widest font-bold text-gray-500 ml-2">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    class="w-full px-6 py-4 bg-gray-50 border border-gray-200 rounded-full focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest transition duration-200 text-forest placeholder-gray-300"
                    placeholder="Enter admin ID"
                >
            </div>

            <div class="space-y-2">
                <label for="password" class="block text-xs uppercase tracking-widest font-bold text-gray-500 ml-2">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    class="w-full px-6 py-4 bg-gray-50 border border-gray-200 rounded-full focus:outline-none focus:border-forest focus:ring-1 focus:ring-forest transition duration-200 text-forest placeholder-gray-300"
                    placeholder="••••••••"
                >
            </div>

            <button 
                type="submit" 
                id="submit-btn"
                class="w-full mt-4 bg-forest text-white py-4 rounded-full uppercase text-[10px] tracking-[0.2em] font-bold hover:bg-opacity-90 transition duration-300 flex items-center justify-center gap-3 disabled:opacity-70 disabled:cursor-not-allowed"
            >
                <span>Authenticate</span>
                <svg id="spinner" class="animate-spin h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="/" class="text-[10px] text-gray-400 hover:text-forest transition border-b border-transparent hover:border-gray-400 pb-0.5">Return to Storefront</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='admin_form.js') }}"></script>
</body>
</html>
