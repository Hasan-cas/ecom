<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ZENFOX Luxury Scents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --sage: #e2e8dd; --dark-forest: #1a2b1a; }
        body { font-family: 'Inter', sans-serif; background-color: #fafaf9; }
        .serif { font-family: 'Playfair Display', serif; }
        .bg-sage { background-color: var(--sage); }
        .text-forest { color: var(--dark-forest); }
        .bg-forest { background-color: var(--dark-forest); }
        .input-field { 
            @apply w-full px-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-[#e2e8dd] focus:border-forest outline-none transition-all duration-200;
        }
    </style>
</head>
<body class="bg-sage text-gray-900 min-h-screen flex flex-col">

    <nav class="flex items-center justify-between px-8 py-6 bg-white border-b border-gray-100">
        <a href="/" class="text-2xl font-bold tracking-tighter serif">ZENFOX.</a>
        <div class="text-[10px] uppercase tracking-[0.2em] font-semibold text-gray-400">Secure Checkout</div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-2xl">
        <div class="mb-10 text-center">
            <h1 class="text-4xl serif italic text-forest mb-2">Complete Your Order</h1>
            <p class="text-sm text-gray-500">Provide your delivery details to secure your signature scent.</p>
        </div>

        <div class="bg-white rounded-[40px] p-8 md:p-12 shadow-sm border border-gray-50">
            <form id="checkoutForm" class="space-y-6">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2 ml-1">Full Name</label>
                    <input type="text" id="customer_name" class="input-field" placeholder="John Doe" required>
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2 ml-1">Phone Number</label>
                    <input type="tel" id="phone" class="input-field" placeholder="+1 (555) 000-0000" required>
                    <p id="phoneError" class="text-red-500 text-[10px] mt-1 hidden">Please enter a valid phone number.</p>
                </div>

                <div>
                    <label class="block text-[10px] uppercase tracking-widest text-gray-400 font-bold mb-2 ml-1">Delivery Address</label>
                    <textarea id="address" rows="3" class="input-field resize-none" placeholder="123 Luxury Lane, Toronto, Canada" required></textarea>
                </div>

                <div class="pt-4">
                    <button type="submit" id="submitBtn" class="w-full bg-forest text-white py-4 rounded-full hover:bg-black transition duration-300 uppercase text-[10px] tracking-[0.3em] font-bold shadow-lg shadow-green-900/10">
                        Place Order
                    </button>
                </div>
            </form>

            <div id="statusContainer" class="mt-8 hidden">
                <div id="statusMessage" class="p-6 rounded-3xl text-center text-sm leading-relaxed"></div>
            </div>
        </div>
    </main>

    <footer class="py-8 text-center text-[10px] uppercase tracking-widest text-gray-400">
        © ZENFOX SCENTS 2024 • Safe & Secure SSL Encryption
    </footer>

    <script src="{{ url_for('static', filename='checkout.js') }}"></script>
</body>
</html>
