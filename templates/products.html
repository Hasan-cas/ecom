<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Collection | Markazus Sunnah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --forest: #1a2f23; --khaki: #e2e8dd; }
        body { font-family: 'Quicksand', sans-serif; background-color: #fff; color: #1a1a1a; }
        .heading-font { font-family: 'Poppins', sans-serif; }
        
        /* Filter States */
        .active-filter { background-color: #000 !important; color: white !important; border-color: #000 !important; }

        /* Horizontal Scroll Logic */
        .no-scrollbar { 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
            display: flex; 
            overflow-x: auto; 
            white-space: nowrap; 
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        .parent-btn, .sub-btn { transition: all 0.3s ease; cursor: pointer; white-space: nowrap; }
        .product-card-img { transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
        .group:hover .product-card-img { transform: scale(1.08); }

        #search-input::placeholder { color: #9ca3af; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.7rem; font-weight: 700; }
        
        /* Navigation Underline */
        .nav-link { position: relative; }
        .nav-link::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px; background: #000; transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<nav class="bg-white border-b sticky top-0 z-50 w-full">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex justify-between items-center h-20">
            <div class="text-2xl heading-font font-extrabold tracking-tight">
                <a href="/" class="text-gray-900">Markazus Sunnah</a>
            </div>
            <div class="hidden md:flex space-x-8 font-medium">
                <a href="/products" class="nav-link text-gray-900 font-bold">Shop</a>
                <a href="/products" class="nav-link text-gray-600 hover:text-gray-900">New Arrivals</a>
                <a href="/products" class="nav-link text-gray-600 hover:text-gray-900">Best Sellers</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/cart" class="font-bold text-gray-700 hover:text-black text-sm uppercase tracking-widest">Cart</a>
            </div>
        </div>
    </div>
</nav>

<header class="py-16 bg-white">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <h1 class="heading-font text-5xl md:text-7xl font-black mb-4 tracking-tighter">The Collection</h1>
        <p class="text-gray-500 uppercase tracking-[0.3em] text-[10px] font-bold">Curated Excellence</p>
    </div>
</header>

<section class="sticky top-20 z-40 bg-white/80 backdrop-blur-lg border-y border-gray-100">
    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="flex flex-col md:flex-row items-center gap-4">
            
            <div class="relative w-full md:w-64 flex-shrink-0">
                <input type="text" id="search-input" placeholder="Search..." 
                    class="w-full border-b border-gray-200 py-2 focus:border-black outline-none text-sm font-bold transition bg-transparent">
            </div>

            <div class="flex items-center gap-3 w-full overflow-hidden">
                <button id="reset-filters-btn" class="flex-shrink-0 w-10 h-10 rounded-full border border-gray-200 hover:bg-black hover:text-white transition-all flex items-center justify-center text-xl font-light">×</button>
                <div id="parent-filter-container" class="no-scrollbar flex gap-2 p-1 bg-gray-50 rounded-full border border-gray-100 w-full">
                    </div>
            </div>

            <div class="relative flex-shrink-0" id="sort-wrapper">
                <button type="button" id="sort-button" class="flex items-center gap-3 bg-white/40 backdrop-blur-md border border-white/20 px-5 py-2.5 rounded-full hover:bg-white/60 transition shadow-sm active:scale-95">
                    <span class="text-[9px] uppercase tracking-[0.2em] font-black text-gray-400">Sort:</span>
                    <span id="sort-label" class="text-[10px] uppercase font-black tracking-widest text-gray-900">New Arrivals</span>
                    <svg id="sort-icon" class="w-3 h-3 text-gray-400 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <div id="sort-dropdown" class="hidden absolute right-0 mt-3 w-56 rounded-2xl bg-white/90 backdrop-blur-xl border border-white/40 shadow-2xl z-50 overflow-hidden transform transition-all duration-200 opacity-0 scale-95">
                    <div class="p-1">
                        <button class="sort-opt w-full text-left px-4 py-3 text-[10px] uppercase font-black tracking-widest text-gray-600 hover:bg-black hover:text-white rounded-xl transition-all" data-value="newest">New Arrivals</button>
                        <button class="sort-opt w-full text-left px-4 py-3 text-[10px] uppercase font-black tracking-widest text-gray-600 hover:bg-black hover:text-white rounded-xl transition-all" data-value="price-low">Price: Low to High</button>
                        <button class="sort-opt w-full text-left px-4 py-3 text-[10px] uppercase font-black tracking-widest text-gray-600 hover:bg-black hover:text-white rounded-xl transition-all" data-value="price-high">Price: High to Low</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="sub-filter-area" class="no-scrollbar gap-2 hidden pt-4 border-t border-gray-50 mt-4">
            </div>
    </div>
</section>

<main class="flex-grow max-w-7xl mx-auto px-4 w-full py-12">
    <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-12">
        <div class="col-span-full py-20 text-center text-gray-400 uppercase text-[10px] font-bold tracking-widest animate-pulse">Accessing Vault...</div>
    </div>
    <div id="pagination" class="flex justify-center items-center space-x-2 mt-20"></div>
</main>

<footer class="bg-black text-white py-16 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <p class="text-[10px] text-gray-500 uppercase tracking-[0.2em] font-bold">© 2026 Markazus Sunnah</p>
    </div>
</footer>

<script src="/static/products.js"></script>
</body>
</html>
