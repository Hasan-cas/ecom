<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ZENFOX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --sage: #e2e8dd; --dark-forest: #1a2b1a; }
        body { font-family: 'Inter', sans-serif; }
        .serif { font-family: 'Playfair Display', serif; }
        .bg-forest { background-color: var(--dark-forest); }
        .text-forest { color: var(--dark-forest); }
        .loader { border-top-color: var(--dark-forest); animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col">

    <nav class="flex items-center justify-between px-8 py-6 border-b border-gray-100 sticky top-0 bg-white/90 backdrop-blur-md z-50">
        <a href="/" class="text-2xl font-bold tracking-tighter serif text-forest no-underline">ZENFOX.</a>
        <div class="flex items-center space-x-6">
            <a href="/" class="text-[10px] uppercase tracking-[0.2em] font-bold text-gray-400 hover:text-forest transition">Back to Shop</a>
            <div class="relative">
                <span class="text-xl">🛒</span>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-forest text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-6 py-12">
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="loader ease-linear rounded-full border-2 border-t-2 border-gray-100 h-12 w-12 mb-4"></div>
            <p class="text-[10px] uppercase tracking-widest text-gray-400">Loading Essence...</p>
        </div>

        <div id="error-view" class="hidden text-center py-20">
            <h2 class="serif text-3xl text-red-800 mb-4">Scent Not Found</h2>
            <p class="text-gray-500 mb-8">The product you are looking for does not exist or has been moved.</p>
            <a href="/" class="px-8 py-3 bg-forest text-white rounded-full text-[10px] uppercase tracking-widest">Return to Collection</a>
        </div>

        <div id="product-view" class="hidden grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
            <div class="bg-gray-50 rounded-[40px] overflow-hidden aspect-[4/5] flex items-center justify-center p-8">
                <img id="product-image" src="" alt="" class="max-w-full max-h-full object-contain mix-blend-multiply">
            </div>

            <div>
                <nav class="mb-6 text-[10px] uppercase tracking-widest text-gray-400">
                    <a href="/" class="hover:text-forest">Collection</a> / <span id="category-crumb">Fragrance</span>
                </nav>

                <h1 id="product-name" class="serif text-5xl text-forest mb-4"></h1>
                
                <div class="flex items-center gap-4 mb-8">
                    <span id="product-price" class="text-2xl font-medium"></span>
                    <span id="product-stock" class="px-3 py-1 text-[9px] uppercase tracking-tighter rounded-full border"></span>
                </div>

                <p id="product-description" class="text-gray-600 leading-relaxed mb-10 font-light"></p>

                <div class="space-y-4">
                    <button id="add-to-cart-btn" class="w-full bg-forest text-white py-5 rounded-full uppercase text-[11px] tracking-[0.2em] font-bold hover:bg-green-900 transition disabled:bg-gray-200">
                        Add to Bag
                    </button>
                    <div id="message-box" class="text-center text-[11px] uppercase tracking-widest font-bold hidden"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 1. Get ID from URL: 127.0.0.1:5000/product.html?id=2
        function getProductIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        // 2. Fetch data from Flask API
        async function fetchProduct() {
            const id = getProductIdFromURL();
            if (!id) {
                showError();
                return;
            }

            try {
                const response = await fetch(`/api/products/${id}`);
                const result = await response.json();

                if (result.status === 'success' && result.data) {
                    renderProduct(result.data);
                } else {
                    showError();
                }
            } catch (error) {
                console.error("Fetch error:", error);
                showError();
            }
        }

        // 3. Render Data to DOM
        function renderProduct(product) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('product-view').classList.remove('hidden');

            document.getElementById('product-name').textContent = product.name;
            document.getElementById('product-price').textContent = `$${parseFloat(product.price).toFixed(2)}`;
            document.getElementById('product-description').textContent = product.description;
            document.getElementById('product-image').src = product.image || 'https://placehold.co/600x800?text=No+Image';
            
            const stockBadge = document.getElementById('product-stock');
            const btn = document.getElementById('add-to-cart-btn');

            if (product.stock > 0) {
                stockBadge.textContent = `In Stock (${product.stock})`;
                stockBadge.className = "px-3 py-1 text-[9px] uppercase tracking-tighter rounded-full border border-green-800 text-green-800";
                btn.onclick = () => addToCart(product.id);
            } else {
                stockBadge.textContent = "Sold Out";
                stockBadge.className = "px-3 py-1 text-[9px] uppercase tracking-tighter rounded-full border border-gray-300 text-gray-400";
                btn.disabled = true;
                btn.textContent = "Out of Stock";
            }
        }

        // 4. Add to Cart Logic
        async function addToCart(productId) {
            const btn = document.getElementById('add-to-cart-btn');
            btn.disabled = true;
            btn.textContent = "Adding...";

            try {
                const response = await fetch('/api/cart/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: productId, quantity: 1 })
                });

                const result = await response.json();

                if (response.ok) {
                    showMessage("Added to bag", "text-green-700");
                    // Update simple badge
                    const badge = document.getElementById('cart-count');
                    badge.textContent = parseInt(badge.textContent) + 1;
                } else {
                    showMessage(result.message || "Error", "text-red-700");
                }
            } catch (err) {
                showMessage("Connection Error", "text-red-700");
            } finally {
                btn.disabled = false;
                btn.textContent = "Add to Bag";
            }
        }

        // Helpers
        function showError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error-view').classList.remove('hidden');
        }

        function showMessage(text, colorClass) {
            const box = document.getElementById('message-box');
            box.textContent = text;
            box.className = `text-center text-[11px] uppercase tracking-widest font-bold mt-4 ${colorClass}`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3000);
        }

        // Initialize
        window.onload = fetchProduct;
    </script>
</body>
</html>
