<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products | ZENFOX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --sage: #e2e8dd; --forest: #1a2b1a; }
        body { font-family: 'Inter', sans-serif; }
        .serif { font-family: 'Playfair Display', serif; }
        .bg-forest { background-color: var(--forest); }
        .text-forest { color: var(--forest); }
        .active-filter { background-color: var(--forest); color: white; border-color: var(--forest); }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen">

    <nav class="flex items-center justify-between px-8 py-6 border-b border-gray-100 sticky top-0 bg-white/90 backdrop-blur-md z-50">
        <a href="/" class="text-2xl font-bold tracking-tighter serif text-forest no-underline">ZENFOX.</a>
        <div class="flex items-center space-x-6">
            <span class="text-xs uppercase tracking-widest font-bold">Catalog</span>
            <a href="/cart" class="text-xl">🛒</a>
        </div>
    </nav>

    <header class="pt-16 pb-8 text-center">
        <h1 class="serif text-5xl text-forest mb-4">The Collection</h1>
        <p class="text-gray-400 uppercase text-[10px] tracking-[0.3em]">Pure Essences & Fragrances</p>
    </header>

    <section class="container mx-auto px-6 mb-12">
        <div class="flex flex-col md:flex-row justify-between items-center gap-6 border-y border-gray-100 py-6">
            
            <div class="relative w-full md:w-64">
                <input type="text" id="search-input" placeholder="Search products..." 
                    class="w-full border-b border-gray-300 py-2 focus:border-forest outline-none text-sm transition">
            </div>

            <div class="flex flex-wrap justify-center gap-3" id="category-filters">
                <button class="filter-btn active-filter px-6 py-2 rounded-full border border-gray-200 text-[10px] uppercase font-bold tracking-widest transition" data-category="all">All</button>
                <button class="filter-btn px-6 py-2 rounded-full border border-gray-200 text-[10px] uppercase font-bold tracking-widest transition" data-category="Floral">Floral</button>
                <button class="filter-btn px-6 py-2 rounded-full border border-gray-200 text-[10px] uppercase font-bold tracking-widest transition" data-category="Woody">Woody</button>
                <button class="filter-btn px-6 py-2 rounded-full border border-gray-200 text-[10px] uppercase font-bold tracking-widest transition" data-category="Fresh">Fresh</button>
            </div>

            <select id="sort-select" class="bg-transparent border-none text-[10px] uppercase font-bold tracking-widest outline-none cursor-pointer">
                <option value="newest">Newest</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
            </select>
        </div>
    </section>

    <main class="container mx-auto px-6 mb-20">
        <div id="products-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-16">
            </div>

        <div id="pagination" class="flex justify-center items-center space-x-4 mt-20">
            </div>
    </main>
        <script src="{{ url_for('static', filename='products.js') }}"></script>
</body>
</html>
