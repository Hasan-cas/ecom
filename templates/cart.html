<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag | Zahab Perfumes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .serif { font-family: 'Playfair Display', serif; }
        
        /* Drawer/Accordion Animation */
        .drawer-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-in-out; }
        .drawer-item.active .drawer-content { max-height: 300px; }
        .drawer-item.active .drawer-icon { transform: rotate(180deg); }
    </style>
</head>
<body class="text-gray-900 min-h-screen">

    <nav class="flex items-center justify-between px-6 py-6 bg-white border-b border-gray-100 sticky top-0 z-40">
        <a href="/" class="text-2xl font-bold tracking-tighter serif">Zahab.</a>
        <span id="cart-count-header" class="text-[10px] uppercase tracking-widest font-bold text-gray-400">0 Items</span>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-12">
        <h1 class="serif text-4xl mb-10">Your Bag</h1>

        <div id="cart-container" class="space-y-4">
            <div class="animate-pulse space-y-4">
                <div class="h-24 bg-gray-200 rounded-xl w-full"></div>
                <div class="h-24 bg-gray-200 rounded-xl w-full"></div>
             </div>
        </div>

        <div id="empty-state" class="hidden text-center py-20">
            <div class="text-6xl mb-6">🧴</div>
            <h2 class="serif text-2xl mb-4">Your bag is empty</h2>
            <a href="/" class="inline-block px-8 py-3 bg-purple-600 text-white rounded-lg font-bold uppercase text-xs tracking-widest">Start Shopping</a>
        </div>

        <div id="cart-options" class="mt-8 space-y-3 hidden">
            <div class="drawer-item bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                <button onclick="toggleDrawer(this)" class="w-full px-6 py-4 flex justify-between items-center hover:bg-gray-50 transition">
                    <span class="text-sm font-bold uppercase tracking-wider">1. Delivery Option</span>
                    <span class="drawer-icon transition-transform">▼</span>
                </button>
                <div class="drawer-content px-6 pb-6">
                    <div class="space-y-3 pt-2">
                        <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:border-purple-500 transition">
                            <input type="radio" name="shipping" value="60" checked class="w-4 h-4 text-purple-600 focus:ring-purple-500">
                            <div class="ml-4">
                                <span class="block text-sm font-bold">Inside Dhaka</span>
                                <span class="text-xs text-gray-500">60 BDT (2-3 Business Days)</span>
                            </div>
                        </label>
                        <label class="flex items-center p-4 border rounded-lg cursor-pointer hover:border-purple-500 transition">
                            <input type="radio" name="shipping" value="120" class="w-4 h-4 text-purple-600 focus:ring-purple-500">
                            <div class="ml-4">
                                <span class="block text-sm font-bold">Outside Dhaka</span>
                                <span class="text-xs text-gray-500">120 BDT (3-5 Business Days)</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="drawer-item bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                <button onclick="toggleDrawer(this)" class="w-full px-6 py-4 flex justify-between items-center hover:bg-gray-50 transition">
                    <span class="text-sm font-bold uppercase tracking-wider">2. Payment Method</span>
                    <span class="drawer-icon transition-transform">▼</span>
                </button>
                <div class="drawer-content px-6 pb-6">
                    <div class="pt-4 p-4 bg-purple-50 rounded-lg border border-purple-100">
                        <p class="text-xs font-bold text-purple-800 uppercase tracking-widest mb-2">Bkash Personal</p>
                        <p class="text-xl font-mono font-bold text-purple-900">017XXXXXXXX</p>
                        <p class="text-[10px] text-purple-600 mt-2 italic">Please include your order ID as a reference.</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="cart-summary" class="mt-10 pt-8 border-t border-gray-200 hidden">
            <div class="space-y-4 mb-8">
                <div class="flex justify-between text-sm text-gray-500">
                    <span>Subtotal</span>
                    <span id="subtotal-price">0.00 BDT</span>
                </div>
                <div class="flex justify-between text-sm text-gray-500">
                    <span>Shipping</span>
                    <span id="shipping-cost">0.00 BDT</span>
                </div>
                <div id="free-delivery-badge" class="hidden py-2 px-3 bg-green-100 text-green-700 text-[10px] font-bold uppercase tracking-widest rounded-md text-center">
                    ✨ Free Delivery Applied (Over 1500 BDT)
                </div>
                <div class="flex justify-between items-center pt-4 border-t border-gray-100">
                    <span class="text-sm uppercase tracking-widest font-bold">Total Amount</span>
                    <span id="grand-total" class="text-3xl font-bold text-purple-700">0.00 BDT</span>
                </div>
            </div>
            
            <button id="checkout-btn" class="w-full bg-black text-white py-5 rounded-xl hover:bg-gray-800 transition duration-300 uppercase text-xs tracking-[0.2em] font-bold shadow-xl">
                Place Order
            </button>
            <button id="clear-btn" class="w-full mt-4 text-gray-400 hover:text-red-500 text-[10px] uppercase tracking-widest font-bold transition">
                Clear Shopping Bag
            </button>
        </div>
    </main>

    <script src="/static/cart.js"></script>
    <script>
        // Simple UI logic for drawer toggling
        function toggleDrawer(button) {
            const item = button.parentElement;
            item.classList.toggle('active');
        }
    </script>
</body>
</html>
