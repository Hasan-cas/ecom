<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenfox Admin | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: '#e2e8dd',
                        forest: '#1a2b1a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .bg-sage { background-color: var(--sage); }
        /* Specific styles for elements created dynamically by admin.js */
        .btn-edit {
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            margin-right: 0.5rem;
            transition: all 0.2s;
        }
        .btn-edit:hover { background-color: #e5e7eb; }

        .btn-delete {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .btn-delete:hover { background-color: #fecaca; }

        /* Order Card Dynamic Styling Helper */
        .order-card {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #f3f4f6;
        }
        .order-card h4 { font-weight: 700; color: #1a2b1a; margin-bottom: 0.5rem; }
        .order-card p { color: #4b5563; font-size: 0.875rem; margin-bottom: 1rem; }
        .order-card select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            background-color: #f9fafb;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-sage text-gray-900 font-sans antialiased">

    <div id="loading-spinner" class="fixed inset-0 bg-white/80 z-[60] hidden flex items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-forest"></div>
    </div>

    <div class="flex h-screen overflow-hidden">
        
        <aside class="hidden md:flex flex-col w-64 bg-forest text-white">
            <div class="h-20 flex items-center justify-center border-b border-gray-700">
                <span class="text-2xl font-serif font-bold tracking-tighter">ZENFOX.</span>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2">
                <a href="#products-section" class="flex items-center px-4 py-3 text-sm font-medium bg-white/10 rounded-lg text-white">
                    <span>Products</span>
                </a>
                <a href="#orders-section" class="flex items-center px-4 py-3 text-sm font-medium text-gray-400 hover:bg-white/5 hover:text-white rounded-lg transition">
                    <span>Orders</span>
                </a>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-sage flex items-center justify-center text-forest font-bold text-xs">AD</div>
                    <div class="text-xs">
                        <p class="font-medium text-white">Admin User</p>
                        <p class="text-gray-400">admin@zenfox.com</p>
                    </div>
                </div>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden relative">
            
            <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8">
                <h1 class="text-xl font-serif font-bold text-forest">Dashboard Overview</h1>
                <button id="logout-btn" class="px-4 py-2 text-sm text-red-600 font-medium hover:bg-red-50 rounded-lg transition border border-transparent hover:border-red-100">
                    Sign Out
                </button>
            </header>

            <main class="flex-1 overflow-y-auto p-8 scroll-smooth">
                
                <section id="products-section" class="mb-12">
                    <div class="flex flex-col md:flex-row gap-8">
                        
                        <div class="w-full md:w-1/3">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 sticky top-6">
                                <h2 class="text-lg font-bold text-forest mb-4 font-serif">Add New Product</h2>
                                <form id="add-product-form" class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Product Name</label>
                                        <input type="text" name="name" required class="w-full rounded-lg border-gray-200 focus:border-forest focus:ring focus:ring-forest/20 text-sm p-2.5 bg-gray-50" placeholder="e.g. Midnight Jasmine">
                                    </div>
                                    
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Price</label>
                                            <input type="number" step="0.01" name="price" required class="w-full rounded-lg border-gray-200 focus:border-forest focus:ring focus:ring-forest/20 text-sm p-2.5 bg-gray-50" placeholder="0.00">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Stock</label>
                                            <input type="number" name="stock" class="w-full rounded-lg border-gray-200 focus:border-forest focus:ring focus:ring-forest/20 text-sm p-2.5 bg-gray-50" placeholder="Qty">
                                        </div>
                                    </div>
                                    <div>
                                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Product Image</label>
                                    <input type="file" name="image" accept="image/*" required class="w-full rounded-lg border-gray-200 focus:border-forest focus:ring focus:ring-forest/20 text-sm p-2 bg-gray-50 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-forest file:text-white hover:file:bg-green-900">
                                </div>              

                                    <div>
                                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Image URL</label>
                                        <input type="url" name="image" class="w-full rounded-lg border-gray-200 focus:border-forest focus:ring focus:ring-forest/20 text-sm p-2.5 bg-gray-50" placeholder="https://...">
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Description</label>
                                        <textarea name="description" rows="3" class="w-full rounded-lg border-gray-200 focus:border-forest focus:ring focus:ring-forest/20 text-sm p-2.5 bg-gray-50" placeholder="Product details..."></textarea>
                                    </div>

                                    <button type="submit" class="w-full bg-forest text-white font-bold text-sm py-3 rounded-lg hover:bg-green-900 transition shadow-lg shadow-forest/20">
                                        Create Product
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div class="w-full md:w-2/3">
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                                    <h3 class="font-bold text-forest">Inventory</h3>
                                    <span class="text-xs text-gray-400 uppercase tracking-widest">Live Database</span>
                                </div>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left">
                                        <thead class="bg-gray-50 text-xs uppercase text-gray-500 font-semibold">
                                            <tr>
                                                <th class="px-6 py-4">ID</th>
                                                <th class="px-6 py-4">Name</th>
                                                <th class="px-6 py-4">Price</th>
                                                <th class="px-6 py-4 text-right">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="products-table-body" class="divide-y divide-gray-100 text-sm">
                                            <tr>
                                                <td colspan="4" class="px-6 py-8 text-center text-gray-400 italic">
                                                    Loading inventory...
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <hr class="border-gray-200 my-12">

                <section id="orders-section">
                    <div class="mb-6 flex items-center justify-between">
                        <h2 class="text-2xl font-serif font-bold text-forest">Recent Orders</h2>
                        <button onclick="fetchOrders()" class="text-xs uppercase tracking-widest font-bold text-gray-500 hover:text-forest">Refresh Data</button>
                    </div>

                    <div id="orders-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        <div class="col-span-full text-center py-12 text-gray-400 bg-white rounded-xl border border-dashed border-gray-300">
                            Loading orders data...
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script src="{{ url_for('static', filename='admin_panel.js') }}"></script>
</body>
</html>
